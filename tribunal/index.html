<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Coven Tribunal | Cactus Coven</title>
  <meta name="description" content="Weekly judgment for the Cactus Coven. Week 6 is in.">
  <meta property="og:title" content="The Coven Tribunal - Week 6">
  <meta property="og:description" content="The ledger has been read. Judgment follows.">
  <meta property="og:image" content="https://cactuscoven.net/tribunal/week-6.png">
  <meta property="og:url" content="https://cactuscoven.net/tribunal/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Oswald:wght@300;500&family=Pirata+One&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0506; --blood:#c4161c; --ember:#ff463c; --bone:#eee4d6; --ash:#968a84; --line:#46181a; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(ellipse at top, #3a0709 0%, var(--bg) 55%) fixed;
           color:var(--bone); font-family:Oswald, sans-serif; font-weight:300; }
    main { max-width:760px; margin:0 auto; padding:40px 16px 64px; text-align:center; }
    .kicker { font-family:Cinzel, serif; color:var(--blood); letter-spacing:.5em; font-size:14px; }
    h1 { font-family:"Pirata One", serif; font-weight:400; font-size:clamp(48px, 12vw, 84px); margin:8px 0 4px; }
    .tag { display:inline-block; background:var(--blood); padding:4px 16px; font-weight:500; letter-spacing:.05em; }
    .latest { display:block; margin:28px auto 0; width:100%; border:1px solid var(--line); }
    h2 { font-family:Cinzel, serif; color:var(--ember); letter-spacing:.15em; margin:56px 0 20px; font-size:20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; }
    .card { color:var(--ash); text-decoration:none; font-size:15px; }
    .card img { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top; border:1px solid var(--line); display:block; margin-bottom:6px; }
    .card:hover span { color:var(--bone); }
    .home { display:inline-block; margin-top:48px; color:var(--ash); }
  </style>
</head>
<body>
  <main>
    <div class="kicker">CACTUS COVEN</div>
    <h1>The Coven Tribunal</h1>
    <span class="tag">WEEK 6</span>
    <a href="week-6.png" target="_blank"><img class="latest" src="week-6.png" alt="Week 6 awards"></a>

    <a class="home" href="/">&larr; Back to the Coven</a>
  </main>
</body>
</html>
